<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云舒卷 · 设置页 效果图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shell.css">
<style>
.setting-head{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%}
</style>
</head>
<body>
<script>if(location.search.indexOf('dark')>=0)document.documentElement.classList.add('dark')</script>
<h1 class="sr-only">云舒卷设置页效果图，桌面 16:10 全视口工作台</h1>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-house" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></symbol>
  <symbol id="i-network" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M10.4 6.9 6.6 15.9M13.6 6.9l3.8 9M7.5 18h9"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12.5" y="8" width="3" height="10" rx="1"/><rect x="18" y="5" width="3" height="13" rx="1"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5.2-5.2 2 2-5.2z"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-grad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9 12 4 2 9l10 5z"/><path d="M6 11.5V17c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c3.9 0 6-2.5 6-5.8 0-4.2-4-5.6-4-9.2 0 0-2.2 1.2-2.2 4 0 1.6-1.2 2.4-1.9 1.9C9.2 11.4 8.6 9.6 8.6 8c-1 .9-2.6 3-2.6 5.4C6 16 8.1 22 12 22Z"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></symbol>
  <symbol id="i-rss" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.2"/><path d="M22 20v-2a4 4 0 0 0-3-3.8M16.5 4.1a3.2 3.2 0 0 1 0 5.9"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .3-9 6.5 6.5 0 0 0-12.6 2A4 4 0 0 0 6 19Z"/></symbol>
  <symbol id="i-columns" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M12 4v16"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 2.9 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.4 1Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-languages" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</svg>

<div class="app-shell is-account">
  <aside class="app-sidebar">
    <div class="sidebar-brand">
      <a class="sidebar-logo" href="#" aria-label="云舒卷"><svg width="31" height="31"><use href="#i-cloud"/></svg><span>云舒卷</span></a>
      <button class="workspace-icon-button sidebar-toggle" aria-label="收起侧栏"><svg width="17" height="17"><use href="#i-columns"/></svg></button>
      <span class="sidebar-mobile-brand">
        <a href="#" aria-label="云舒卷"><svg width="26" height="26"><use href="#i-cloud"/></svg></a>
        <button class="workspace-icon-button" aria-label="展开侧栏"><svg width="18" height="18"><use href="#i-menu"/></svg></button>
      </span>
    </div>
    <nav class="sidebar-navigation" aria-label="主导航">
      <a class="sidebar-link sidebar-home-link" href="#"><svg width="18" height="18"><use href="#i-house"/></svg><span class="sidebar-label">首页</span></a>
      <div class="sidebar-section">
        <button class="sidebar-group-toggle">知识<svg width="14" height="14"><use href="#i-chevron"/></svg></button>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-file"/></svg><span class="sidebar-label">笔记</span></a>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-library"/></svg><span class="sidebar-label">知识库</span></a>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-network"/></svg><span class="sidebar-label">知识图谱</span></a>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-chart"/></svg><span class="sidebar-label">统计</span></a>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-compass"/></svg><span class="sidebar-label">知识广场</span></a>
      </div>
      <div class="sidebar-section">
        <button class="sidebar-group-toggle">AI 助手<svg width="14" height="14"><use href="#i-chevron"/></svg></button>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-message"/></svg><span class="sidebar-label">AI 对话</span></a>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-history"/></svg><span class="sidebar-label">会话管理</span></a>
      </div>
      <div class="sidebar-section">
        <button class="sidebar-group-toggle">学习成长<svg width="14" height="14"><use href="#i-chevron"/></svg></button>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-grad"/></svg><span class="sidebar-label">每日回顾</span></a>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-flame"/></svg><span class="sidebar-label">每日任务</span></a>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-timer"/></svg><span class="sidebar-label">番茄钟</span></a>
      </div>
      <div class="sidebar-section">
        <button class="sidebar-group-toggle">社交<svg width="14" height="14"><use href="#i-chevron"/></svg></button>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-rss"/></svg><span class="sidebar-label">动态</span></a>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-users"/></svg><span class="sidebar-label">好友</span></a>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-message"/></svg><span class="sidebar-label">私信</span></a>
        <a class="sidebar-link" href="#"><svg width="18" height="18"><use href="#i-bell"/></svg><span class="sidebar-label">通知</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-account is-open" aria-label="账户菜单">
        <span class="sidebar-avatar">欧</span>
        <span class="sidebar-account-copy"><strong>欧阳</strong><small>个人空间</small></span>
        <svg width="17" height="17" style="color:var(--color-text-secondary)"><use href="#i-settings"/></svg>
      </button>
    </div>
  </aside>

  <main class="app-workspace">
    <section class="account-page">
      <div class="account-topbar">
        <span class="account-breadcrumb">个人中心</span>
        <button class="account-global-search"><svg width="17" height="17"><use href="#i-search"/></svg><span>搜索笔记，或快速前往你的知识空间…</span><kbd>Ctrl K</kbd></button>
        <div class="account-top-actions">
          <button class="workspace-icon-button" aria-label="隐藏页宠"><svg width="20" height="20"><use href="#i-cloud"/></svg></button>
          <a class="workspace-icon-button" href="#" aria-label="通知"><svg width="19" height="19"><use href="#i-bell"/></svg></a>
          <a class="account-avatar" href="#" aria-label="个人信息">欧</a>
        </div>
      </div>

      <header class="account-header">
        <div class="account-header-copy">
          <h1>设置</h1>
          <p>主题、语言、页宠与聊天字号，改动即时生效并同步到云端</p>
        </div>
      </header>

      <div class="account-body">
        <section class="panel">
          <h2 class="panel-title">外观与语言</h2>
          <div class="setting-row">
            <div class="setting-copy">
              <span class="setting-icon"><svg width="19" height="19"><use href="#i-sun"/></svg></span>
              <span class="setting-text"><strong>主题</strong><small>浅色模式</small></span>
            </div>
            <button class="switch" role="switch" aria-checked="false" aria-label="主题"></button>
          </div>
          <div class="setting-row">
            <div class="setting-copy">
              <span class="setting-icon"><svg width="19" height="19"><use href="#i-languages"/></svg></span>
              <span class="setting-text"><strong>语言</strong><small>简体中文</small></span>
            </div>
            <div class="segmented">
              <button aria-pressed="true">中文</button>
              <button aria-pressed="false">English</button>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-title">页宠</h2>
          <div class="setting-row">
            <div class="setting-copy">
              <span class="setting-icon"><svg width="19" height="19"><use href="#i-cloud"/></svg></span>
              <span class="setting-text"><strong>页宠小卷</strong><small>常驻右下角的云朵精灵，可点击互动、拖拽移动</small></span>
            </div>
            <button class="switch" role="switch" aria-checked="true" aria-label="页宠小卷"></button>
          </div>
        </section>

        <section class="panel">
          <div class="setting-row">
            <div class="setting-copy">
              <span class="setting-icon"><svg width="19" height="19"><use href="#i-type"/></svg></span>
              <span class="setting-text"><strong>聊天字体大小</strong><small>调整私聊消息、引用与输入框的文字大小（实时预览）</small></span>
            </div>
            <span class="slider-value">13px</span>
          </div>
          <div class="slider-row">
            <span>小</span>
            <input type="range" min="12" max="20" value="13" aria-label="聊天字体大小">
            <span>大</span>
          </div>
          <div class="chat-preview" style="font-size:13px">
            <div class="bubble theirs">今天天气不错，一起出去走走？</div>
            <div class="bubble mine">好啊，等我五分钟！</div>
            <div class="bubble input">输入消息…</div>
          </div>
        </section>
      </div>
    </section>
    <div class="floating-pet"><img src="study-cloud.png" alt=""></div>
  </main>
</div>
</body>
</html>
